<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Framefind — TRAKE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="shell shell-wide">
      <nav class="site-nav" aria-label="Primary">
        <a href="/">Search frames</a>
        <a href="/videos">Video library</a>
        <a href="/kis">KIS</a>
        <a href="/qa">QA</a>
        <a href="/trake" aria-current="page">TRAKE</a>
      </nav>

      <header class="hero">
        <p class="brand">Framefind · TRAKE</p>
        <h1>Temporal event alignment</h1>
        <p class="lede">
          Parse E1…En, align ordered frames in one video, export
          <code>video_id,frame_E1,…,frame_En</code>.
        </p>

        <form id="trake-form" class="search-form" autocomplete="off">
          <label class="sr-only" for="query">TRAKE query</label>
          <textarea
            id="query"
            name="query"
            rows="6"
            placeholder="Paste intro + E1 / E2 / E3 event lines…"
            required
          ></textarea>
          <div class="controls">
            <label class="field export-field">
              <span>Query id</span>
              <input
                id="query-id"
                type="text"
                value="query-p1-16-trake"
                placeholder="query-p1-16-trake"
                spellcheck="false"
              />
            </label>
            <label class="field">
              <span>Results</span>
              <select id="top-chains">
                <option value="10">10</option>
                <option value="24" selected>24</option>
                <option value="100">100</option>
              </select>
            </label>
            <button type="submit" id="submit-btn">Run TRAKE</button>
            <button type="button" id="export-btn" class="export-btn">Export CSV</button>
          </div>
        </form>
      </header>

      <section class="status" id="status" aria-live="polite"></section>

      <section class="results" id="results" hidden>
        <div class="results-head">
          <div>
            <h2>Aligned chains</h2>
            <p id="results-meta"></p>
          </div>
        </div>

        <aside class="plan" id="plan" hidden>
          <h3>Event plan</h3>
          <dl id="plan-body"></dl>
        </aside>

        <div class="trake-editor" id="editor" hidden>
          <h3>Selected chain (editable)</h3>
          <label class="field">
            <span>Video id</span>
            <input id="edit-video" type="text" spellcheck="false" />
          </label>
          <div class="trake-edit-events" id="edit-events"></div>
          <p class="hint">Frames must be strictly increasing for a valid export.</p>
        </div>

        <div class="trake-chains" id="chains"></div>
      </section>
    </main>

    <dialog id="lightbox" class="lightbox">
      <div class="lightbox-bar">
        <button type="button" class="lightbox-close" id="lightbox-close">Close</button>
        <button type="button" class="lightbox-open-video" id="lightbox-open-video" hidden>
          Play from this moment
        </button>
      </div>
      <div class="lightbox-stage">
        <img id="lightbox-img" alt="" />
        <video id="lightbox-video" controls playsinline hidden></video>
      </div>
      <p id="lightbox-meta"></p>
    </dialog>

    <script type="module" src="/static/trake.js"></script>
  </body>
</html>
