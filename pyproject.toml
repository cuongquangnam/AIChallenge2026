[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-retrieval"
version = "0.1.0"
description = "Offline video indexing pipeline with visual + textual search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "pillow>=10.4.0",
  "qdrant-client>=1.12.0",
  "elasticsearch>=8.15.0,<9.0.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "typer>=0.12.0",
  "rich>=13.9.0",
  "uuid6>=2024.7.10",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4.0",
  "transformers>=4.45.0",
  "openai-whisper>=20240930",
  "google-genai>=1.0.0",
  "rapidocr>=2.0.0",
  "onnxruntime>=1.19.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast isolated tests",
  "integration: tests that need local infra, real models, or in-memory stores",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[project.scripts]
video-index = "video_retrieval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_retrieval = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
